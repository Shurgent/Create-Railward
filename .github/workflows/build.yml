name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build every supported Minecraft version
        run: ./gradlew buildAll --stacktrace

      - name: Prepare isolated GameTest directories
        run: |
          for version in 1.18.2 1.19.2 1.20.1 1.20.1-create6; do
            mkdir -p ".devdocs/tmp/gametest/$version"
            printf 'eula=true\n' > ".devdocs/tmp/gametest/$version/eula.txt"
            : > ".devdocs/tmp/gametest/$version/server.properties"
          done

      - name: Run dedicated GameTests for every supported version
        run: ./gradlew gameTestAll --stacktrace -PrailwardConsoleLogLevel=info
