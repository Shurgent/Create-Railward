plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

//version = mod_version
def versionFile = rootProject.file('mod_version.txt')
def mixinRefmapFile = layout.buildDirectory.file("generated/mixin/${mod_id}.refmap.json")
def ccGameTest = rootProject.findProperty('railwardCcTest')?.toString()?.toBoolean() ?: false
def createGeneration = findProperty('create_generation')?.toString() ?: '5'
ext.mod_version = versionFile.text.trim()
version = mod_version

group = mod_group_id

base {
    // Project names distinguish dependency variants that share one Minecraft
    // version (for example 1.20.1/Create 5 and 1.20.1/Create 6).
    archivesName = "${mod_base}-${project.name}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Keep in-game tests out of the production source set and release jar. Forge's
// GameTest run combines this source set with main only for runGameTestServer.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    clientTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    clientTestImplementation.extendsFrom implementation
    clientTestCompileOnly.extendsFrom compileOnly
    clientTestRuntimeOnly.extendsFrom runtimeOnly
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    def runDirectoryOverride = rootProject.findProperty('railwardRunDirectory')?.toString()?.trim()
    def consoleLogLevel = rootProject.findProperty('railwardConsoleLogLevel')?.toString()?.trim() ?: 'debug'
    def persistenceTestPhase = rootProject.findProperty('railwardPersistenceTestPhase')?.toString()?.trim()
    if (persistenceTestPhase && !['prepare', 'verify', 'network', 'network_multi', 'controller', 'scheduled', 'scheduled_route', 'signal', 'coupler_prepare', 'coupler', 'coupler_auto_prepare', 'coupler_auto', 'coupler_storage_prepare', 'coupler_storage', 'cargo_unloading'].contains(persistenceTestPhase))
        throw new GradleException("railwardPersistenceTestPhase must be 'prepare', 'verify', 'network', 'network_multi', 'controller', 'scheduled', 'scheduled_route', 'signal', 'coupler_prepare', 'coupler', 'coupler_auto_prepare', 'coupler_auto', 'coupler_storage_prepare', 'coupler_storage', or 'cargo_unloading'")
    def clientProbe = rootProject.findProperty('railwardClientProbe')?.toString()?.toBoolean() ?: false
    def clientProbeHost = rootProject.findProperty('railwardClientProbeHost')?.toString()?.trim() ?: '127.0.0.1'
    def clientProbePort = rootProject.findProperty('railwardClientProbePort')?.toString()?.trim() ?: '25565'
    def clientProbeMode = rootProject.findProperty('railwardClientProbeMode')?.toString()?.trim() ?: 'late_join'
    if (clientProbe && !['late_join', 'multi_client', 'controller', 'scheduled', 'scheduled_route', 'signal', 'coupler', 'coupler_auto', 'coupler_storage', 'cargo_unloading'].contains(clientProbeMode))
        throw new GradleException("railwardClientProbeMode must be 'late_join', 'multi_client', 'controller', 'scheduled', 'scheduled_route', 'signal', 'coupler', 'coupler_auto', 'coupler_storage', or 'cargo_unloading'")
    def clientProbeName = rootProject.findProperty('railwardClientProbeName')?.toString()?.trim()
    def mainRunDirectory = runDirectoryOverride
            ? rootProject.file(runDirectoryOverride)
            : minecraft_version == '1.18.2'
            ? rootProject.file('run')
            : rootProject.file("run/${project.name}")
    def dataRunDirectory = minecraft_version == '1.18.2'
            ? rootProject.file('run-data')
            : rootProject.file("run-data/${project.name}")
    def gameTestRunDirectory = runDirectoryOverride
            ? rootProject.file(runDirectoryOverride)
            : rootProject.file(".devdocs/tmp/gametest/${project.name}")

    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory mainRunDirectory
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', consoleLogLevel

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            arg "-mixin.config=${mod_id}.mixins.json"
            if (clientProbe) {
                property 'railward.clientProbe', 'true'
                property 'railward.clientProbeMode', clientProbeMode
                args '--server', clientProbeHost, '--port', clientProbePort
                if (clientProbeName)
                    args '--username', clientProbeName
                mods {
                    "${mod_id}" {
                        source sourceSets.clientTest
                    }
                }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            arg "-mixin.config=${mod_id}.mixins.json"
            if (persistenceTestPhase) {
                property 'railward.persistenceTestPhase', persistenceTestPhase
                mods {
                    "${mod_id}" {
                        source sourceSets.gameTest
                    }
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory gameTestRunDirectory
            property 'forge.enabledGameTestNamespaces', mod_id
            arg "-mixin.config=${mod_id}.mixins.json"
            if (ccGameTest)
                property 'railward.ccTest', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory dataRunDirectory

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', rootProject.file('src/generated/resources/'),
                    '--existing', rootProject.file('src/main/resources/')
        }
    }
}

// Automated clients use isolated run directories. Keep their music muted so
// concurrent driver/observer probes remain unobtrusive without changing any
// other sound or user option.
if (rootProject.findProperty('railwardClientProbe')?.toString()?.toBoolean()) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doFirst {
            def runDirectoryOverride = rootProject.findProperty('railwardRunDirectory')?.toString()?.trim()
            def clientRunDirectory = runDirectoryOverride
                    ? rootProject.file(runDirectoryOverride)
                    : minecraft_version == '1.18.2'
                    ? rootProject.file('run')
                    : rootProject.file("run/${project.name}")
            clientRunDirectory.mkdirs()
            def optionsFile = new File(clientRunDirectory, 'options.txt')
            def options = optionsFile.exists() ? optionsFile.readLines('UTF-8') : []
            def musicOptionFound = false
            options = options.collect { line ->
                if (line.startsWith('soundCategory_music:')) {
                    musicOptionFound = true
                    return 'soundCategory_music:0.0'
                }
                return line
            }
            if (!musicOptionFound)
                options.add('soundCategory_music:0.0')
            optionsFile.setText(options.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir rootProject.file('src/generated/resources') }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
	maven { url = "https://api.modrinth.com/maven" } // JEI ???
	maven { url = 'https://maven.blamejared.com' }  // JEI
	maven { url = "https://maven.creeperhost.net" } // Create
	maven { url = "https://maven.createmod.net" }  // Create 6, Ponder, Flywheel 1.x
	maven { url = "https://maven.tterrag.com" }     // Registrate
	maven {
		url = "https://squiddev.cc/maven/"
		content { includeGroup "org.squiddev" }
	} // Optional CC: Tweaked integration
	maven {
		url = "https://maven.squiddev.cc"
		content { includeGroup "cc.tweaked" }
	} // CC: Tweaked 1.20+
	
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}") // Adds registrate as a dependency

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
	
	// JEI
	compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
	runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

	// Create
    implementation fg.deobf("com.simibubi.create:create-${create_minecraft_version}:${create_version}:slim") { transitive = false }
    if (createGeneration == '6') {
        implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
        implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    } else {
        implementation fg.deobf("com.jozufozu.flywheel:flywheel-forge-${flywheel_minecraft_version}:${flywheel_version}")
    }
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	// Optional CC: Tweaked integration. The API is compile-only: CC:Tweaked is
	// neither bundled nor required at runtime by Create: Railward.
	if (minecraft_version == '1.20.1') {
		compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
		if (ccGameTest)
			gameTestRuntimeOnly fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}")
	} else {
		compileOnly fg.deobf("org.squiddev:cc-tweaked-${minecraft_version}:${cct_version}:api")
		if (ccGameTest)
			gameTestRuntimeOnly fg.deobf("org.squiddev:cc-tweaked-${minecraft_version}:${cct_version}")
	}

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            create_version_range: create_version_range, cct_version_range: cct_version_range,
            pack_format: pack_format, resource_pack_format: resource_pack_format,
            data_pack_format: data_pack_format,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    inputs.property('forge_obj_schema', minecraft_version == '1.20.1' ? 'forge47' : 'legacy')

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // Forge 47 replaced the legacy OBJ loader option names used by Forge 40/43.
    // Translate them only in the processed 1.20.1 resources so the canonical
    // 1.18.2 assets and the 1.19.2 port keep using their native schema.
    if (minecraft_version == '1.20.1') {
        filesMatching('assets/railward/models/**/*.json') {
            filter { line -> line
                .replace('"detectCullableFaces"', '"automatic_culling"')
                .replace('"diffuseLighting"', '"shade_quads"')
                .replace('"flip-v"', '"flip_v"')
                .replace('"ambientToFullbright"', '"emissive_ambient"')
                .replace('"materialLibraryOverride"', '"mtl_override"')
            }
        }
    }
}

// ForgeGradle's copyIdeResources support already copies processed resources into IDE output folders.
// Writing directly into bin/main from a custom task can leave Eclipse with out-of-sync workspace metadata.

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    inputs.property('release_mod_version', mod_version)
    dependsOn tasks.named('compileJava')

    from(mixinRefmapFile) {
        into ''
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : rootProject.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile).configure {
    inputs.property('mixin_refmap_name', "${mod_id}.refmap.json")
    outputs.file(mixinRefmapFile)
    options.compilerArgs.add("-AoutRefMapFile=${mixinRefmapFile.get().asFile.absolutePath}")

    doFirst {
        mixinRefmapFile.get().asFile.parentFile.mkdirs()
    }
}
